<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lịch Trực Nhật Phòng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; }
    .zalo-bg { background: linear-gradient(135deg, #0068ff 0%, #0052cc 100%); }
  </style>
</head>
<body class="pb-10">

  <header class="zalo-bg text-white pt-6 pb-12 px-4 rounded-b-3xl shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <span class="text-xs uppercase tracking-wider bg-white/20 px-2.5 py-1 rounded-full font-medium">Lịch nội bộ</span>
        <h1 class="text-xl font-bold mt-2" id="roomTitle">Đang tải dữ liệu...</h1>
        <p class="text-blue-100 text-xs mt-0.5" id="todayDateStr"></p>
      </div>
      <div class="w-11 h-11 rounded-full bg-white/15 flex items-center justify-center">
        <i class="fa-solid fa-calendar-check text-xl"></i>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 -mt-7 space-y-4">
    <!-- Ca trực hôm nay -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-blue-50">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Cán bộ trực hôm nay</span>
        <span id="statusBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-green-100 text-green-700">Đang trực</span>
      </div>

      <div class="py-5 text-center">
        <div class="w-16 h-16 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-2.5 text-2xl font-bold" id="avatarInitial">-</div>
        <h2 class="text-2xl font-extrabold text-gray-800" id="todayPerson">...</h2>
        <p class="text-xs text-gray-500 mt-1.5" id="nextPerson">...</p>
      </div>

      <div class="bg-slate-50 rounded-xl p-3.5 mb-4 text-xs text-gray-600 space-y-1.5 border border-slate-100" id="taskList"></div>

      <button onclick="copyZaloText()" class="w-full zalo-bg text-white font-semibold py-3 px-4 rounded-xl shadow active:scale-95 transition flex items-center justify-center space-x-2">
        <i class="fa-regular fa-copy"></i>
        <span>Sao chép tin nhắn & Mở Zalo</span>
      </button>
    </div>

    <!-- Lịch 10 ngày tới -->
    <div class="bg-white rounded-2xl p-5 shadow-sm">
      <h3 class="font-bold text-gray-800 text-sm mb-3 flex items-center">
        <i class="fa-solid fa-list-ol text-blue-600 mr-2"></i>
        Lịch phân công 10 ngày làm việc tới
      </h3>
      <div class="divide-y divide-gray-100 text-sm" id="scheduleList"></div>
    </div>
  </main>

  <script>
    let appData = null;
    let generatedMsg = "";

    function formatDateVN(d) {
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function getDayName(d) {
      return ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"][d.getDay()];
    }

    function isWorkDay(d, holidays) {
      const day = d.getDay();
      if (day === 0 || day === 6) return false;
      return !holidays.includes(formatDateVN(d));
    }

    async function loadSchedule() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        appData = await res.json();
      } catch (e) {
        alert("Không tải được file data.json!");
        return;
      }

      const today = new Date();
      document.getElementById("roomTitle").innerText = `Lịch Trực - ${appData.roomName}`;
      document.getElementById("todayDateStr").innerText = `${getDayName(today)}, ${formatDateVN(today)}`;

      // Render công việc
      const taskEl = document.getElementById("taskList");
      taskEl.innerHTML = `<div class="font-bold text-gray-700 mb-1">Nhiệm vụ trực nhật:</div>` +
        appData.tasks.map(t => `<div>• ${t}</div>`).join("");

      // Tính 10 ngày làm việc tiếp theo dựa trên currentIndex trong data.json
      let list = [];
      let curDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      let idx = appData.currentIndex % appData.members.length;

      // Nếu hôm nay GitHub Action đã chạy và cộng index lên 1 rồi, thì người trực hôm nay là (idx - 1)
      const todayStr = formatDateVN(today);
      if (appData.lastRunDate === todayStr) {
        idx = (idx - 1 + appData.members.length) % appData.members.length;
      }

      while (list.length < 10) {
        if (isWorkDay(curDate, appData.holidays)) {
          list.push({
            dateStr: formatDateVN(curDate),
            dayName: getDayName(curDate),
            person: appData.members[idx]
          });
          idx = (idx + 1) % appData.members.length;
        }
        curDate.setDate(curDate.getDate() + 1);
      }

      const current = list[0];
      const next = list[1];

      document.getElementById("todayPerson").innerText = `Đ/c ${current.person}`;
      const nameParts = current.person.trim().split(" ");
      document.getElementById("avatarInitial").innerText = nameParts[nameParts.length - 1][0].toUpperCase();
      document.getElementById("nextPerson").innerText = `Dự kiến tiếp theo (${next.dayName}, ${next.dateStr}): Đ/c ${next.person}`;

      const schedEl = document.getElementById("scheduleList");
      schedEl.innerHTML = list.map((item, i) => `
        <div class="py-2.5 flex justify-between items-center ${i === 0 ? 'bg-blue-50/70 -mx-3 px-3 rounded-lg font-bold text-blue-700' : 'text-gray-700'}">
          <div>
            <span>${item.dayName}</span>
            <span class="text-xs text-gray-400 ml-1">(${item.dateStr})</span>
          </div>
          <div>Đ/c ${item.person}</div>
        </div>
      `).join("");

      generatedMsg = `🔔 [THÔNG BÁO TRỰC NHẬT - ${appData.roomName.toUpperCase()}]\n`
        + `📅 Ngày: ${current.dayName}, ${current.dateStr}\n`
        + `👤 Cán bộ trực: Đ/c ${current.person}\n`
        + `⏭️ Trực kế tiếp (${next.dayName}): Đ/c ${next.person}\n`
        + `🌐 Xem lịch cả phòng: ${window.location.href}`;
    }

    function copyZaloText() {
      navigator.clipboard.writeText(generatedMsg).then(() => {
        alert("Đã sao chép tin nhắn! Đang chuyển sang Zalo...");
        window.location.href = "zalo://";
      });
    }

    window.onload = loadSchedule;
  </script>
</body>
</html>

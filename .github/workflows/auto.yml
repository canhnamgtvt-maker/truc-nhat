name: Tự động nhắc trực nhật & Định kỳ Zalo

on:
  schedule:
    # 1. Khung giờ Trực nhật (Đặt 3 nhịp phút lẻ để né nghẽn mạng lúc nửa đêm UTC):
    # Nhịp 1: 23:27 UTC (06:27 sáng VN) | Nhịp 2: 23:36 UTC (06:36 sáng VN) | Nhịp 3: 23:46 UTC (06:46 sáng VN)
    - cron: '27,36,46 23 * * *'
    # Nhịp bọc lót sớm: 00:07 UTC (07:07 sáng VN) phòng khi cả giờ 23h UTC bị GitHub bảo trì
    - cron: '7 0 * * *'
    # 2. Khung giờ Đảng phí: 01:53 UTC và 02:07 UTC ngày 05 (Khoảng 08:53 - 09:07 sáng ngày 05 hàng tháng)
    - cron: '53 1 5 * *'
    - cron: '7 2 5 * *'
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Chế độ chạy (normal / swap / test_party_fee)'
        required: false
        default: 'normal'
      busy_person:
        description: 'Người báo bận'
        required: false
        default: ''
      replacement_person:
        description: 'Người trực thay'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send-zalo:
    runs-on: ubuntu-latest
    steps:
      - name: Tải dữ liệu
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Xử lý nhắc việc & Gửi tin nhắn vào nhóm Zalo
        env:
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
          ACTION_MODE: ${{ github.event.inputs.action_mode || 'normal' }}
          BUSY_PERSON: ${{ github.event.inputs.busy_person || '' }}
          REPLACEMENT_PERSON: ${{ github.event.inputs.replacement_person || '' }}
        run: node notify.js

      - name: Lưu dữ liệu nếu có thay đổi
        run: |
          git config --global user.name "Auto Duty Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cập nhật trạng thái hệ thống" && git pull --rebase origin main && git push)
